services:
  db:
    image: postgres:16-alpine
    container_name: chnu-jobs-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - chnu_jobs_data:/var/lib/postgresql/data
    networks:
      - chnu-jobs-net

  app:
    build: .
    container_name: chnu-jobs-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - chnu-jobs-net

volumes:
  chnu_jobs_data:

networks:
  chnu-jobs-net:
