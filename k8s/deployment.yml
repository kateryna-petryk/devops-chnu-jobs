apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app.kubernetes.io/instance: myapp
    app.kubernetes.io/name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: myapp
      app.kubernetes.io/name: myapp
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: myapp
        app.kubernetes.io/name: myapp
    spec:
      containers:
        - name: myapp
          image: chnu-jobs:ci
          ports:
            - containerPort: 3000
