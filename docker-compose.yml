services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chnu_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-chnu_jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chnu_jobs_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chnu_jobs} -d ${POSTGRES_DB:-chnu_jobs}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chnu_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-chnu_jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chnu_jobs_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SESSION_SECRET: ${SESSION_SECRET:-chnu-jobs-secret}
      PORT: 3000
      DB_INIT_RETRIES: ${DB_INIT_RETRIES:-15}
      DB_INIT_DELAY: ${DB_INIT_DELAY:-2}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
