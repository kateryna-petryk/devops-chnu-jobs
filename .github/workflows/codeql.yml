name: CodeQL

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  skip-private-repo:
    name: Skip on private repositories
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Explain why CodeQL is skipped
        run: |
          echo "CodeQL is being skipped because this repository is private."
          echo "If the repository becomes public, or is moved to an organization with GitHub Code Security enabled,"
          echo "the analyze job in this workflow can run normally."

  analyze:
    name: Analyze Python code
    if: ${{ github.event.repository.private != true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
